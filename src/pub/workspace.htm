<html>
<head>

<!-- from Javascript from Beginner to Professional, Svekis L, Putten M, Percival R; Chapter 10
  //Aynsc calls:

  //REFs: https://www.w3schools.com/js/js_validation.asp
  //             https://stackoverflow.com/questions/42803866/form-is-submitting-even-after-validation-function-returning-false
  //
-->
  <script>
    function validateNLPrompt() {
      const errLabel = document.getElementById('errLabel');
      errLabel.textContent = '';
      userPrompt = document.getElementById('nlpCmd').value.trim();
      let isValid = true;
      document.getElementById('nlpCmd').value = "";

	  if (userPrompt == '') {
		errLabel.textContent = "Please enter a prompt.";
		errLabel.style = "color: red";
		isValid = false;
	  }

	  if (!isValid) {
		event.preventDefault();       // Stop the form from submitting if there are errors
	  }
	  else{
	    //alert("Submitting prompt: " + userPrompt);
		//nlpCommandForm.submit();

        let newBody = "<b>Prompt accepted: " + userPrompt + "</b><p>";

        newBody = newBody + "<table>";
        newBody = newBody + "  <tr><th>Title</th><th>Title</th><th>Title</th></tr>";
        newBody = newBody + "  <tr><td>Bob</td><td>Daily</td><td>2025</td></tr>";
        newBody = newBody + "  <tr><td>Bugs</td><td>Bunny</td><td>1910</td></tr>";
        newBody = newBody + "</table>";

		document.getElementById("mainContentArea").innerHTML = (newBody);
	  }

	  // If isValid remains true, the browser automatically proceeds to submit!
	  return isValid;
    }
  </script>
</head>
<body>

<div class="apptitle">MapleEMR</div>
<p>
	<div id="leftMenu" align="left">
		<ul>
		  <li><a class="menuActive" href="javascript:void(0)">PATIENT1_LASTNM, Name</a></li>
		  <li><a href="javascript:void(0)">&nbsp;&nbsp;&nbsp;Medications</a></li>
		  <li><a href="javascript:void(0)">&nbsp;&nbsp;&nbsp;Orders</a></li>
		  <li><a href="javascript:void(0)">&nbsp;&nbsp;&nbsp;Allergies</a></li>
		  <li><a href="javascript:void(0)">PATIENT2_LASTNM, Name</a></li>
		</ul>
	</div>
</div>

<div id="mainContentArea" align="center">
Main Content Area (Default)
<p>
<table>
  <tr><th>Title</th><th>Title</th><th>Title</th></tr>
  <tr><td>Data</td><td>Data</td><td>Data</td></tr>
  <tr><td>Data</td><td>Data</td><td>Data</td></tr>
</table>
</div>

<div id="nlpCommandArea" align="right" class="nlpCommandAreaCls">
  <form action="http://127.0.0.1:8000/nlpcmd" method="post" id="nlpCommandForm" onSubmit="event.preventDefault(); return validateNLPrompt()" align="right" class="nlpCommandAreaCls">

	<input type="text" id="nlpCmd" name="nlpCmd" placeholder="How can I help?">
	<input type="submit" value=">>">
	<p>
	<label id="errLabel">
  </form>
</div>

</body>
