function submitNLPrompt(){

   document.getElementById("leftMenu").innerHTML = document.getElementById("leftMenu").innerHTML + "(revised)";
   document.getElementById("mainContentArea").innerHTML = "(new)";
   document.getElementById("nlPrompt").innerHTML = document.getElementById("nlPrompt").innerHTML + "(revised)";

   //userPrompt = "port mandy to the ER";
   userPrompt = "sht";
   //userPrompt = "this prompt is too long for the ";

   // collect the user's prompt from the form and validate if it can be submitted to the NL engine
   validPrompt = validateNLPrompt( userPrompt );

   // validPrompt = false; // for testing only
   if (validPrompt.length == 0) {
      document.getElementById("mainContentArea").innerHTML = "Prompt accepted";
   }
   else{
      document.getElementById("mainContentArea").innerHTML = "Invalid prompt: " + validPrompt;
   }

   //alert("Done");
}

// Validates the content of prompt from the user before sending it to the ML engine.
//
function validateNLPrompt(userPrompt){
    alert("user prompted: " + userPrompt);

    // check for lengths
    if ( userPrompt.length > 100 ) return "Prompt is too long";
    if ( userPrompt.length < 4 ) return "Prompt is too short";

    // replace patient names with codifiers
    return "";
}
